<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/public/favicon.ico">
  <link rel="stylesheet" href="/public/assets/css/tabler.min.css">
  <link rel="stylesheet" href="/public/assets/app.css">
  <script>
    document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('enc_theme') === 'dark' ? 'dark' : 'light')
  </script>
</head>
<body>
  <!-- SPA 壳层：侧边栏 + 顶栏常驻，右侧 5 个 page-content 占位由 hash 路由懒加载切换 -->
  <!-- 结构对齐 layout.js（现由本页静态承载）：offcanvas 只包菜单，桌面端(≥992px)自动变 static 常驻 -->

  <aside class="navbar navbar-vertical navbar-expand-lg">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar-menu" aria-label="打开菜单">
        <span class="navbar-toggler-icon"></span>
      </button>
      <h1 class="navbar-brand navbar-brand-autodark">
        <a href="#overview">
          <img src="/public/logo.png" width="28" height="28" alt="logo" class="me-2">
          <span class="align-middle">alist-encrypt</span>
        </a>
      </h1>
      <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar-menu">
        <div class="offcanvas-header">
          <h2 class="offcanvas-title">
            <img src="/public/logo.png" width="24" height="24" alt="logo" class="me-2">
            alist-encrypt
          </h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="关闭"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="#overview" data-page="overview">
                <span class="nav-link-icon"><i class="ti ti-dashboard"></i></span>
                <span class="nav-link-title">概览</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#alist" data-page="alist">
                <span class="nav-link-icon"><i class="ti ti-cloud"></i></span>
                <span class="nav-link-title">Alist 配置</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#webdav" data-page="webdav">
                <span class="nav-link-icon"><i class="ti ti-folders"></i></span>
                <span class="nav-link-title">WebDAV 配置</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#cloud" data-page="cloud">
                <span class="nav-link-icon"><i class="ti ti-lock"></i></span>
                <span class="nav-link-title">云端加密</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#decrypt" data-page="decrypt">
                <span class="nav-link-icon"><i class="ti ti-lock-open"></i></span>
                <span class="nav-link-title">在线解密</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="mt-auto px-3 pb-3 d-none d-lg-block">
        <div class="text-muted small">管理控制台</div>
      </div>
    </div>
  </aside>

  <div class="page">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <h1 class="navbar-title py-3 ps-0" data-topbar-title>概览</h1>
        <div class="navbar-nav flex-row order-md-last align-items-center">
          <a class="nav-link px-2 hide-theme-dark" href="#" data-theme-toggle title="切换暗色模式" aria-label="切换暗色模式">
            <i class="ti ti-moon-stars"></i>
          </a>
          <a class="nav-link px-2 hide-theme-light" href="#" data-theme-toggle title="切换亮色模式" aria-label="切换亮色模式">
            <i class="ti ti-sun-high"></i>
          </a>
          <div class="nav-item dropdown ms-2">
            <a href="#" class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown">
              <span class="avatar avatar-sm bg-blue-lt" data-user-avatar>A</span>
              <div class="d-none d-xl-block ps-2">
                <div data-user-name>-</div>
                <div class="mt-1 small text-muted" data-user-version></div>
              </div>
            </a>
            <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow">
              <a href="#" class="dropdown-item" data-logout>
                <i class="ti ti-logout icon dropdown-item-icon"></i> 退出登录
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-body">
        <div class="page-content" id="page-overview"></div>
        <div class="page-content d-none" id="page-alist"></div>
        <div class="page-content d-none" id="page-webdav"></div>
        <div class="page-content d-none" id="page-cloud"></div>
        <div class="page-content d-none" id="page-decrypt"></div>
      </div>
    </div>
  </div>

  <script src="/public/assets/js/tabler.min.js"></script>
  <script type="module">
    import { requireAuth, logout } from '/public/shared/auth.js'
    import { toast } from '/public/shared/ui.js'
    import { enhanceIcons } from '/public/shared/icons.js'
    import { setUser, toggleTheme, startRouter } from '/public/shared/router.js'

    // 页面逻辑模块：registerPage 注册 mount 钩子（片段 HTML 注入后 script 不执行，逻辑必须模块化）
    await Promise.all([
      import('/public/shared/pages/overview.js'),
      import('/public/shared/pages/alist.js'),
      import('/public/shared/pages/webdav.js'),
      import('/public/shared/pages/cloud.js'),
      import('/public/shared/pages/decrypt.js')
    ])

    // 壳层静态 <i class="ti ti-*"> 标记转内联 svg（之后动态注入的内容由 MutationObserver 自动处理）
    enhanceIcons(document.body)

    document.querySelectorAll('[data-theme-toggle]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault()
        toggleTheme()
      })
    })
    document.querySelector('[data-logout]').addEventListener('click', (e) => {
      e.preventDefault()
      logout()
      toast('已退出登录', 'info')
    })

    // 校验登录态并填充用户信息（未登录时 requireAuth 内部会跳转登录页）
    try {
      const data = await requireAuth()
      setUser(data.userInfo, data.version)
    } catch (e) {
      // 网络错误等：页面保留，提示错误；401 已由 api 层跳转
      if (e.code !== 401 && e.code !== 403 && e.message !== 'unauthorized') {
        console.error(e)
        toast(e.message || '获取用户信息失败', 'danger')
      }
    }

    startRouter()
  </script>
</body>
</html>
